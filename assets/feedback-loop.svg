<svg xmlns="http://www.w3.org/2000/svg" width="620" height="620" viewBox="0 0 620 620" role="img" aria-labelledby="title desc">
  <title id="title">A shared learning loop for understanding, generation and reward</title>
  <desc id="desc">Text, images, video and audio surround a unified multimodal model. Understanding informs generation, whose output is evaluated by a reward signal. The question is whether this feedback produces trustworthy improvement.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#bce3e3" opacity=".18"/></pattern>
    <linearGradient id="core" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff0bd"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
  </defs>
  <rect width="620" height="620" fill="url(#dots)"/>
  <g fill="none" stroke="#91cecf" stroke-width="1.4">
    <circle cx="310" cy="300" r="220" opacity=".25"/>
    <circle cx="310" cy="300" r="160" opacity=".24" stroke-dasharray="4 9"/>
    <path d="M210 187C301 115 448 157 471 276M461 336C405 454 247 475 170 367M146 309C124 268 144 216 177 195" stroke-width="2.5" opacity=".9"/>
  </g>
  <g fill="#b4e2df"><circle cx="263" cy="160" r="5"/><circle cx="458" cy="357" r="5"/><circle cx="143" cy="268" r="5"/></g>
  <path d="M215 215 263 258M407 224 360 264M310 379V344" fill="none" stroke="#c4e9e5" stroke-width="2" stroke-dasharray="5 6"/>
  <g transform="translate(228 240)">
    <rect x="0" y="0" width="164" height="112" rx="25" fill="#053c4b" opacity=".35" transform="translate(0 7)"/>
    <rect width="164" height="112" rx="25" fill="url(#core)"/>
    <path d="M25 28h17m-17 8h10m82 40h20m-10-8v16" stroke="#735019" stroke-width="2" stroke-linecap="round" opacity=".55"/>
    <text x="82" y="52" fill="#173f46" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle">One model.</text>
    <text x="82" y="78" fill="#36514e" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">Two abilities.</text>
  </g>
  <g transform="translate(69 122)">
    <rect width="175" height="105" rx="16" fill="#f3fbfb"/>
    <g transform="translate(18 18)" fill="none" stroke="#087080" stroke-width="2.2"><path d="M0 0h24v18H9l-6 5v-5H0Z"/><path d="M6 6h12M6 11h8"/></g>
    <text x="18" y="65" fill="#12414a" font-family="Arial,sans-serif" font-size="20" font-weight="700">Understand</text>
    <text x="18" y="87" fill="#4a6970" font-family="Arial,sans-serif" font-size="14">Interpret &amp; reason</text>
  </g>
  <g transform="translate(376 156)">
    <rect width="175" height="105" rx="16" fill="#f3fbfb"/>
    <g transform="translate(18 16)" fill="none" stroke="#087080" stroke-width="2.2"><rect width="28" height="22" rx="3"/><path d="m3 18 8-8 6 6 5-5 6 6"/><circle cx="21" cy="6" r="2" fill="#ffd166" stroke="none"/></g>
    <text x="18" y="65" fill="#12414a" font-family="Arial,sans-serif" font-size="20" font-weight="700">Generate</text>
    <text x="18" y="87" fill="#4a6970" font-family="Arial,sans-serif" font-size="14">Create &amp; refine</text>
  </g>
  <g transform="translate(221 390)">
    <rect width="178" height="105" rx="16" fill="#d0ece9"/>
    <g transform="translate(18 17)" fill="none" stroke="#087080" stroke-width="2.2"><circle cx="12" cy="12" r="12"/><path d="m6 12 4 4 8-9"/></g>
    <text x="18" y="65" fill="#12414a" font-family="Arial,sans-serif" font-size="20" font-weight="700">Reward</text>
    <text x="18" y="87" fill="#3c6369" font-family="Arial,sans-serif" font-size="14">Evaluate &amp; improve</text>
  </g>
  <g fill="none" stroke="#99d8d5" stroke-width="1.7" opacity=".8">
    <g transform="translate(302 60)"><path d="M-10 2h20M0 2v21M-6 23H6"/></g>
    <g transform="translate(514 407)"><rect x="-15" y="-10" width="24" height="20" rx="3"/><path d="m9-4 9-5V9l-9-5"/></g>
    <g transform="translate(91 403)"><path d="M-14-3v6M-7-10v20M0-16v32M7-10v20M14-3v6" stroke-linecap="round"/></g>
  </g>
  <text x="310" y="561" fill="#c4e9e5" font-family="Arial,sans-serif" font-size="14" letter-spacing="2" text-anchor="middle">TEXT · IMAGE · VIDEO · AUDIO</text>
